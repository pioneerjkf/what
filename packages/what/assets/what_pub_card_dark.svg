<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label=".what pub.dev card">
  <title>.what — 2-Phase LPDAG Reactive State Engine</title>
  <desc>Official pub.dev square banner card for the what state framework.</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap');

      .card-canvas {
        fill: #070B14;
        stroke: url(#card-border);
        stroke-width: 3;
      }
      .badge-rect {
        fill: rgba(34, 211, 238, 0.10);
        stroke: rgba(34, 211, 238, 0.50);
        stroke-width: 2;
      }
      .badge-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #22D3EE;
        letter-spacing: 0.28em;
      }
      .meta-label {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 16.5px;
        font-weight: 600;
        fill: #94A3B8;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .footer-sub {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15.5px;
        font-weight: 600;
        fill: #64748B;
        letter-spacing: 0.26em;
        text-transform: uppercase;
      }
      .pipeline-label {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 16.5px;
        font-weight: 700;
        fill: #CBD5E1;
        letter-spacing: 0.18em;
      }
      .grid-line {
        stroke: #1E293B;
        stroke-width: 2;
      }
      .corner-cross {
        stroke: #475569;
        stroke-width: 2.2;
        stroke-linecap: round;
      }
      .logo-dot {
        fill: #22D3EE;
      }
      .logo-glyph {
        fill: #FFFFFF;
      }
    </style>

    <!-- Radial Core Energy Glow behind .what logo -->
    <radialGradient id="core-glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.24" />
      <stop offset="35%" stop-color="#0284C7" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#0369A1" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#070B14" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Premium Rim Border Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.4" />
    </linearGradient>

    <!-- Precision Technical Matrix Grid -->
    <pattern id="matrix-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.2" fill="#1E293B" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Card Base Shell -->
  <rect class="card-canvas" x="8" y="8" width="984" height="984" rx="44" />

  <!-- Blueprint Matrix Grid -->
  <rect x="8" y="8" width="984" height="984" rx="44" fill="url(#matrix-grid)" />

  <!-- Central Radial Cyan Energy Glow -->
  <rect x="8" y="8" width="984" height="984" rx="44" fill="url(#core-glow)" />

  <!-- Precision Engineering Corner Target Crosshairs (Aligned to rx=44 curvature center: 52, 52) -->
  <path class="corner-cross" d="M42 52 H62 M52 42 V62" />
  <path class="corner-cross" d="M938 52 H958 M948 42 V62" />
  <path class="corner-cross" d="M42 948 H62 M52 938 V958" />
  <path class="corner-cross" d="M938 948 H958 M948 938 V958" />

  <!-- ================= TOP HEADER SECTION ================= -->
  <g transform="translate(500, 112)">
    <!-- Pill Badge -->
    <rect class="badge-rect" x="-120" y="-20" width="240" height="40" rx="20" />
    <text class="badge-text" x="0" y="7" text-anchor="middle">WHAT CORE</text>
    <!-- Top Architecture Label -->
    <text class="meta-label" x="0" y="56" text-anchor="middle">2-Phase LPDAG Reactive Engine</text>
  </g>

  <!-- Top Hairline Divider -->
  <line class="grid-line" x1="90" y1="205" x2="910" y2="205" />

  <!-- ================= CENTER CORE HERO: .what LOGO ================= -->
  <!-- Bounding box exact center alignment (scale: 0.300, centered at x=500, y=468) -->
  <g transform="translate(500, 468) scale(0.300) translate(-1347.5, 375)">
    <!-- Cyan Dot -->
    <path class="logo-dot" d="M131 7Q103 7 87.5 -10.0Q72 -27 72 -64Q72 -101 87.5 -118.0Q103 -135 131 -135Q159 -135 174.5 -118.0Q190 -101 190 -64Q190 -27 174.5 -10.0Q159 7 131 7Z" />
    <!-- White .what Glyphs (Noto Serif Display 500) -->
    <path class="logo-glyph" d="M269 -473Q264 -494 255.5 -505.0Q247 -516 236.0 -521.0Q225 -526 211 -526H202V-536H462V-526H438Q406 -526 392.0 -517.5Q378 -509 378 -488Q378 -479 380.5 -467.0Q383 -455 386 -441L450 -214Q457 -188 464.5 -160.0Q472 -132 479.5 -104.5Q487 -77 494 -53H496Q502 -75 507.0 -95.5Q512 -116 517.5 -136.5Q523 -157 529 -179L623 -532H687L796 -203Q803 -184 809.0 -165.0Q815 -146 821.5 -126.5Q828 -107 834.5 -88.0Q841 -69 846 -49H849Q855 -72 861.0 -97.0Q867 -122 874.0 -148.5Q881 -175 888 -200L949 -433Q953 -448 955.5 -461.0Q958 -474 958 -484Q958 -507 941.5 -516.5Q925 -526 887 -526H853V-536H1062V-526H1038Q1020 -526 1005.5 -519.5Q991 -513 981.0 -496.0Q971 -479 963 -448L845 0H762L613 -453L492 0H408Z M1080 0V-10H1089Q1115 -10 1133.0 -17.5Q1151 -25 1159.5 -43.0Q1168 -61 1168 -95V-668Q1168 -700 1159.0 -717.5Q1150 -735 1133.5 -742.5Q1117 -750 1090 -750H1083V-760H1278V-558Q1278 -539 1278.0 -520.0Q1278 -501 1278.0 -482.0Q1278 -463 1277 -443H1279Q1292 -489 1316.5 -511.0Q1341 -533 1370.5 -540.0Q1400 -547 1426 -547Q1514 -547 1557.5 -500.5Q1601 -454 1601 -352V-96Q1601 -62 1608.0 -43.5Q1615 -25 1631.5 -17.5Q1648 -10 1674 -10H1678V0H1491V-385Q1491 -450 1469.0 -489.0Q1447 -528 1393 -528Q1349 -528 1324.0 -503.0Q1299 -478 1288.5 -437.5Q1278 -397 1278 -351V-95Q1278 -61 1286.5 -43.0Q1295 -25 1312.5 -17.5Q1330 -10 1355 -10H1362V0Z M1918 10Q1843 10 1799.0 -30.5Q1755 -71 1755 -140Q1755 -217 1811.0 -254.0Q1867 -291 1982 -295L2064 -298V-387Q2064 -440 2058.0 -473.0Q2052 -506 2034.0 -521.5Q2016 -537 1980 -537Q1927 -537 1911.0 -501.5Q1895 -466 1895 -385Q1847 -385 1822.0 -399.5Q1797 -414 1797 -447Q1797 -483 1822.5 -505.0Q1848 -527 1890.5 -537.0Q1933 -547 1984 -547Q2079 -547 2126.5 -508.0Q2174 -469 2174 -375V-76Q2174 -51 2180.0 -36.5Q2186 -22 2200.0 -16.0Q2214 -10 2236 -10H2239V0H2071V-104H2069Q2058 -63 2036.0 -38.0Q2014 -13 1984.0 -1.5Q1954 10 1918 10ZM1947 -8Q1982 -8 2008.5 -28.0Q2035 -48 2049.5 -80.5Q2064 -113 2064 -151V-287L2005 -285Q1927 -281 1897.5 -247.0Q1868 -213 1868 -133Q1868 -91 1876.5 -63.0Q1885 -35 1903.0 -21.5Q1921 -8 1947 -8Z M2520 10Q2446 10 2410.0 -24.5Q2374 -59 2374 -146V-526H2299V-536Q2338 -536 2367.5 -543.5Q2397 -551 2418 -567Q2440 -583 2453.5 -608.5Q2467 -634 2474 -670H2484V-536H2621V-526H2484V-107Q2484 -56 2503.5 -31.0Q2523 -6 2561 -6Q2575 -6 2590.5 -9.0Q2606 -12 2623 -18V-8Q2610 -2 2581.0 4.0Q2552 10 2520 10Z" />
  </g>

  <!-- ================= BOTTOM FOOTER SECTION ================= -->
  <!-- Bottom Hairline Divider -->
  <line class="grid-line" x1="90" y1="730" x2="910" y2="730" />

  <!-- LPDAG Architecture Pipeline Diagram -->
  <g transform="translate(500, 788)">
    <!-- Phase 1: Push-Dirty -->
    <text class="pipeline-label" x="-265" y="6" text-anchor="middle">PUSH-DIRTY</text>

    <!-- Connector Left -->
    <line x1="-175" y1="0" x2="-55" y2="0" stroke="#334155" stroke-width="2.2" stroke-dasharray="5 5" />
    <polygon points="-55,-6 -45,0 -55,6" fill="#22D3EE" />

    <!-- Core Dynamic Reactor Node -->
    <circle cx="0" cy="0" r="18" fill="rgba(34, 211, 238, 0.16)" stroke="#22D3EE" stroke-width="2.4" />
    <circle cx="0" cy="0" r="6" fill="#22D3EE" />

    <!-- Connector Right -->
    <line x1="55" y1="0" x2="175" y2="0" stroke="#334155" stroke-width="2.2" stroke-dasharray="5 5" />
    <polygon points="55,-6 45,0 55,6" fill="#22D3EE" />

    <!-- Phase 2: Lazy-Pull -->
    <text class="pipeline-label" x="265" y="6" text-anchor="middle">LAZY-PULL</text>
  </g>

  <!-- Bottom Core Architectural Spec -->
  <text class="footer-sub" x="500" y="868" text-anchor="middle">Pure Dart · High-Performance · Glitch-Free</text>
</svg>
